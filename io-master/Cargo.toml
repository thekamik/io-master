[package]
name = "io-master"
version = "0.1.0"
edition = "2024"

[dependencies]
# System calls without unsafe code: asking whether the current
# user may read and write a device file (access(2), "fs"), and
# reading random bytes from the kernel (getrandom(2), "rand").
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "rand"] }

# The keyring of the system (the Secret Service of the desktop:
# GNOME Keyring, KWallet), which keeps secrets such as API keys
# encrypted on disk. "rt-async-io" lets the crate run its D-Bus
# connection on a small runtime of its own, so it can be used
# from plain, blocking code; "crypto-rust" encrypts the secrets
# on their way between this program and the keyring service.
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }

# Overwriting secrets in memory with zeros when they are no
# longer needed, in a way the compiler cannot optimize away.
zeroize = "1.9.1"
