[package]
name = "io-master"
version = "0.1.0"
edition = "2024"

[dependencies]
# System calls without unsafe code: asking whether the current
# user may read and write a device file (access(2), "fs"),
# reading random bytes from the kernel (getrandom(2), "rand"),
# and stopping a leftover TPM emulator (kill(2), "process").
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "rand", "process"] }

# Overwriting secrets in memory with zeros when they are no
# longer needed, in a way the compiler cannot optimize away.
zeroize = "1.9.1"

# The TPM 2.0: sealing the secret of the device and keeping the
# marker of the installation (security/tpm/). A Rust wrapper of tpm2-tss,
# the TPM library of the system (package libtss2-dev).
tss-esapi = "7.7.0"

# JSON read and written by hand into plain values, so that the types
# of the program carry no serialization code: the requests and
# answers of the AI services (ai/api/provider/), the answers of the
# tasks of the AI (ai/tasks/), the file of a test project
# (business/test_projects/exchange/). For the templates of the AI
# connections (ai/api/connection.rs), "preserve_order" keeps the fields of a template in the order the
# evaluator wrote them, in the request and in the report of a check
# (without it they come out sorted by name).
serde_json = { version = "1.0.154", features = ["preserve_order"] }

# The asynchronous runtime under the window (Tauri) and the requests
# to the AI services: the long works wait for the model without a
# thread each, and blocking work goes to its own threads
# (spawn_blocking). "sync" gives the channels that carry a reply while
# it is written and the stop signals; "net" serves the fake AI
# service of the tests.
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }

# The views and forms of the page as JSON, at the boundary to the
# window only (src/tauri_ui/serializer/).
serde = { version = "1.0", features = ["derive"] }

# The databases: SQLite with SQLCipher, which encrypts the whole
# file with AES-256 (db/, db/encryption/sqlcipher.rs). "bundled-sqlcipher" compiles a fixed,
# known version of SQLCipher into the program; it uses the
# cryptography of the system's OpenSSL (package libssl-dev).
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }

# Turning a password into a key (db/encryption/keys.rs): Argon2id, the
# recommended password hashing function, slow on purpose so that
# guessing passwords is expensive.
argon2 = "0.6.0"

# Encrypting the key of a database with a key derived from the
# password: AES-256 in GCM mode, which also detects any change of
# the encrypted key.
aes-gcm = "0.11.1"

# Deriving several keys from one secret (HKDF with SHA-256).
hkdf = "0.13.0"
sha2 = "0.11.1"

# The HTTPS client for the AI connections (ai/api/provider/client.rs).
# The most widely used HTTP client of Rust, from the tokio world.
# "rustls" is TLS written in Rust (no OpenSSL), with the trusted
# certificates of the system; "http2" for the services that prefer
# it. The defaults are switched off so that no proxy of the
# environment is used.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }

# The desktop interface (src/tauri_ui/, ui/): a window of the
# system with a web view (WebKitGTK on Linux) that shows the page of
# ui/, and calls into Rust through commands, without a network port.
# "custom-protocol" serves the page built into the program also in
# development builds, so that no development server is needed.
tauri = { version = "2.12.4", features = ["custom-protocol"] }

# The PDFs carried in an exported scheme, as text in its JSON
# (business/test_projects/exchange/). The standard crate for it; already used
# by Tauri, so it adds no new code.
base64 = "0.22.1"

# The dialogs of the system to choose files (the PDFs of a standard,
# the files of projects; src/tauri_ui/commands.rs). The
# official plugin of Tauri; it is called only from Rust, so the page
# never gets a way to the files of the computer itself.
tauri-plugin-dialog = "2.8.3"

[dev-dependencies]
# A fake AI service for the tests (ai/api/test_support.rs): an HTTPS
# server on 127.0.0.1 with a certificate made for the test (rcgen;
# "pem" writes it as the CA certificate of a connection) and TLS
# from rustls (tokio-rustls), so that the client is tested with real
# TLS 1.3 but without network.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }

# Reading and writing on the connections of the fake service, and
# waiting in the tests.
tokio = { version = "1.53.3", features = ["io-util", "time"] }

# Argon2id is slow on purpose; without optimization (the default
# of debug builds) a login would take seconds. Only these crates
# are optimized; the program itself stays easy to debug.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[build-dependencies]
# Prepares the desktop interface at build time (build.rs): reads
# tauri.conf.json and capabilities/, makes the permissions of the
# commands.
tauri-build = "2.7.3"
