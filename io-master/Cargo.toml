[package]
name = "io-master"
version = "0.1.0"
edition = "2024"

[dependencies]
# System calls without unsafe code: asking whether the current
# user may read and write a device file (access(2), "fs"), and
# reading random bytes from the kernel (getrandom(2), "rand").
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "rand"] }

# The keyring of the system (the Secret Service of the desktop:
# GNOME Keyring, KWallet), which keeps secrets such as API keys
# encrypted on disk. "rt-async-io" lets the crate run its D-Bus
# connection on a small runtime of its own, so it can be used
# from plain, blocking code; "crypto-rust" encrypts the secrets
# on their way between this program and the keyring service.
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }

# Overwriting secrets in memory with zeros when they are no
# longer needed, in a way the compiler cannot optimize away.
zeroize = "1.9.1"

# Reading the configuration file, written in TOML. The file is
# read into a plain table and checked by hand (config/config.rs),
# so the types of the program carry no serialization code.
toml = "1.1.8"

# The asynchronous runtime the web server runs on: many browser
# requests are served at once without a thread for each.
# "rt-multi-thread" and "macros" start it from main(), "net" opens
# the listening socket, "signal" notices Ctrl+C for a clean stop.
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal"] }

# The web framework: routes requests to handler functions. Made by
# the tokio team; the most widely used Rust web framework.
axum = "0.8.9"

# Reading the fields of HTML forms (the login form) into a Rust
# struct. Used only in web_ui/, at the boundary to the browser.
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# Sending requests to the web server in tests without opening
# a network port ("util" gives the oneshot() call).
tower = { version = "0.5.3", features = ["util"] }

# Reading the body of a response in tests.
http-body-util = "0.1.5"
