[package]
name = "io-master"
version = "0.1.0"
edition = "2024"

[dependencies]
# System calls without unsafe code: asking whether the current
# user may read and write a device file (access(2), "fs"),
# reading random bytes from the kernel (getrandom(2), "rand"),
# and stopping a leftover TPM emulator (kill(2), "process").
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "rand", "process"] }

# Overwriting secrets in memory with zeros when they are no
# longer needed, in a way the compiler cannot optimize away.
zeroize = "1.9.1"

# The TPM 2.0: sealing the secret of the device and keeping the
# marker of the installation (tpm/). A Rust wrapper of tpm2-tss,
# the TPM library of the system (package libtss2-dev).
tss-esapi = "7.7.0"

# Reading and writing the temporary installation file as JSON
# (installation/installation.rs), until the system database
# exists. The file is read into a plain JSON value and checked by
# hand, so the types of the program carry no serialization code.
serde_json = "1.0.154"

# The asynchronous runtime the web server runs on: many browser
# requests are served at once without a thread for each.
# "rt-multi-thread" and "macros" start it from main(), "net" opens
# the listening socket, "signal" notices Ctrl+C for a clean stop.
# "sync" gives the channels that carry a reply while it is written.
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }

# The web framework: routes requests to handler functions. Made by
# the tokio team; the most widely used Rust web framework.
axum = "0.8.9"

# Reading the fields of HTML forms (the login form) into a Rust
# struct. Used only in web_ui/, at the boundary to the browser.
serde = { version = "1.0", features = ["derive"] }

# The databases: SQLite with SQLCipher, which encrypts the whole
# file with AES-256 (db/). "bundled-sqlcipher" compiles a fixed,
# known version of SQLCipher into the program; it uses the
# cryptography of the system's OpenSSL (package libssl-dev).
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }

# Turning a password into a key (db/keys.rs): Argon2id, the
# recommended password hashing function, slow on purpose so that
# guessing passwords is expensive.
argon2 = "0.6.0"

# Encrypting the key of a database with a key derived from the
# password: AES-256 in GCM mode, which also detects any change of
# the encrypted key.
aes-gcm = "0.11.1"

# Deriving several keys from one secret (HKDF with SHA-256).
hkdf = "0.13.0"
sha2 = "0.11.1"

# The HTTPS client for the API of Anthropic (ai/anthropic.rs).
# The most widely used HTTP client of Rust, from the tokio world.
# "rustls" is TLS written in Rust (no OpenSSL), with the trusted
# certificates of the system; "http2" for the connection that the
# API prefers. The defaults are switched off so that no proxy of the
# environment is used.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }

# Turning the channel of a streamed reply into a stream of
# server-sent events for the browser (web_ui/chat_page.rs). Already
# used by axum and reqwest themselves, so it adds no new code.
futures-util = { version = "0.3.34", default-features = false }

[dev-dependencies]
# Sending requests to the web server in tests without opening
# a network port ("util" gives the oneshot() call).
tower = { version = "0.5.3", features = ["util"] }

# Reading the body of a response in tests.
http-body-util = "0.1.5"

# A fake Anthropic service for the tests (ai/test_support.rs): an
# HTTPS server on 127.0.0.1 with a certificate made for the test
# (rcgen) and TLS from rustls (tokio-rustls), so that the client is
# tested with real TLS 1.3 but without network.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }

# Reading and writing on the connections of the fake service, and
# waiting in the tests.
tokio = { version = "1.53.3", features = ["io-util", "time"] }

# Argon2id is slow on purpose; without optimization (the default
# of debug builds) a login would take seconds. Only these crates
# are optimized; the program itself stays easy to debug.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
